# Example manifest for the festival mainstage set.
#
# Start with:
#   vizcore start examples/vj_festival_mainstage.yml
#
# A writable control preset can be attached when you want HUD reactivity and
# MIDI Learn bindings to round-trip with "Save Project":
#
# control_preset: assets/vj_festival_mainstage_controls.json
scene: vj_festival_mainstage.rb
audio_source: file
audio_file: assets/complex_demo_loop.wav

profiles:
  mic:
    audio_source: mic
    audio_file:
