# Example manifest for the riser crystal show.
#
# Start with:
#   vizcore start examples/riser_crystal_show.yml
#
# A writable control preset can be attached when you want HUD reactivity and
# MIDI Learn bindings to round-trip with "Save Project":
#
# control_preset: assets/riser_crystal_show_controls.json
scene: riser_crystal_show.rb
audio_source: file
audio_file: assets/complex_demo_loop.wav

profiles:
  mic:
    audio_source: mic
    audio_file:
